<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOX AI</title>
<style>
:root{--bg1:#02030a;--bg2:#0a1030;--tx:#f5f7ff;--mu:#9aa4c7;--gl:rgba(255,255,255,.08);--bd:rgba(255,255,255,.16);--ac:#2f8cff;--ac2:#7fd1ff}
:root[data-theme=light]{--bg1:#e9eefb;--bg2:#cfdcff;--tx:#0b1230;--mu:#4d5a85;--gl:rgba(255,255,255,.55);--bd:rgba(255,255,255,.8)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--tx);background:linear-gradient(160deg,var(--bg1),var(--bg2));background-size:200% 200%;animation:bg 18s ease infinite;min-height:100vh}
@keyframes bg{50%{background-position:100% 100%}}
body::before{content:"";position:fixed;width:340px;height:340px;border-radius:50%;background:radial-gradient(var(--ac),transparent 70%);opacity:.25;top:-80px;right:-80px;filter:blur(30px);pointer-events:none}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 150px}
.glass{background:var(--gl);border:1px solid var(--bd);border-radius:24px;backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 40px rgba(0,0,0,.25);padding:16px;margin-bottom:14px}
h1{font-size:28px;margin:0}h2{font-size:15px;margin:0 0 10px;color:var(--mu);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.logo{background:linear-gradient(90deg,var(--ac2),var(--ac));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;letter-spacing:.08em}
.sub{color:var(--mu);margin:2px 0 16px}
textarea{width:100%;min-height:140px;background:transparent;border:0;outline:0;resize:none;color:var(--tx);font:inherit;font-size:17px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
button{font:inherit;color:var(--tx);background:var(--gl);border:1px solid var(--bd);border-radius:14px;padding:9px 14px;cursor:pointer;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
button:active{transform:scale(.93)}
.pri{width:100%;padding:15px;font-weight:700;font-size:17px;background:linear-gradient(135deg,var(--ac),#5b6bff);border:0;color:#fff;box-shadow:0 0 28px rgba(47,140,255,.6);animation:glow 2.4s ease-in-out infinite}
.pri:disabled{opacity:.6;animation:none}
@keyframes glow{50%{box-shadow:0 0 44px rgba(47,140,255,.9)}}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button.on{background:var(--ac);border-color:transparent;color:#fff}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.v{position:relative;padding:12px;border-radius:18px;background:var(--gl);border:1px solid var(--bd);cursor:pointer;transition:all .25s cubic-bezier(.3,1.6,.5,1)}
.v.sel{border-color:var(--ac2);box-shadow:0 0 22px rgba(47,140,255,.5);transform:scale(1.03)}
.v b{display:block}.v small{color:var(--mu)}.v .fav{position:absolute;top:6px;right:8px;background:none;border:0;padding:2px;font-size:18px}
.v .pv{margin-top:8px;padding:5px 10px;font-size:13px}
label{display:block;color:var(--mu);font-size:14px;margin:10px 0 4px}
input[type=range]{width:100%;accent-color:var(--ac)}
select{width:100%;padding:10px;border-radius:12px;background:var(--gl);color:var(--tx);border:1px solid var(--bd);font:inherit}
select option{color:#000}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item .t{flex:1;min-width:0}.item .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--mu)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;gap:4px;padding:8px;border-radius:30px;z-index:20}
.nav button{border:0;background:none;padding:10px 16px;border-radius:22px;font-size:13px}.nav button.on{background:var(--ac);color:#fff;box-shadow:0 0 18px rgba(47,140,255,.6)}
.player{position:fixed;left:50%;transform:translate(-50%,0);width:calc(100% - 28px);max-width:492px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:19;margin:0;padding:12px 14px}
.player.hide{display:none}
.wave{display:flex;gap:3px;align-items:center;height:26px}.wave i{flex:1;background:linear-gradient(var(--ac2),var(--ac));border-radius:3px;height:20%}
.playing .wave i{animation:w .9s ease-in-out infinite}
@keyframes w{50%{height:100%}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:50%;transform:translateX(-50%);z-index:50;padding:10px 16px;border-radius:16px;max-width:90%}
.err{color:#ff7a8a}.view{animation:in .35s ease}@keyframes in{from{opacity:0;filter:blur(8px);transform:translateY(10px)}}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="player" class="glass player hide">
  <div class="row" style="flex-wrap:nowrap">
    <button id="pp" style="width:44px;height:44px;border-radius:50%;padding:0">▶</button>
    <div style="flex:1"><div class="wave" id="wave"></div>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
      <div class="row" style="font-size:12px;color:var(--mu)"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
  </div>
  <div class="row" style="margin-top:6px">
    <button id="rp">↺ Replay</button>
    <input type="range" id="vol" min="0" max="1" step="0.05" value="1" style="width:90px">
    <button id="dl">⬇</button><button id="sh">⇪</button><button id="cl">✕</button>
  </div>
</div>
<nav class="glass nav" id="nav"></nav>

<script>
"use strict";
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const st={tab:"home",voices:[],gender:"all",voice:LS.get("voice",null),favs:LS.get("favs",[]),speed:LS.get("speed",1),
  theme:LS.get("theme","dark"),text:"",busy:false,err:"",hist:[],apiOk:null,cur:null};
const audio=new Audio();
document.documentElement.dataset.theme=st.theme;

/* ---------- IndexedDB: history + offline audio ---------- */
const DB=new Promise((res,rej)=>{const r=indexedDB.open("vox",1);r.onupgradeneeded=()=>r.result.createObjectStore("h",{keyPath:"id"});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function tx(mode,fn){const db=await DB;return new Promise((res,rej)=>{const t=db.transaction("h",mode),q=fn(t.objectStore("h"));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})}
const hAll=async()=>((await tx("readonly",s=>s.getAll()))||[]).sort((a,b)=>b.ts-a.ts);
const hPut=i=>tx("readwrite",s=>s.put(i));
const hDel=id=>tx("readwrite",s=>s.delete(id));
const hClear=()=>tx("readwrite",s=>s.clear());

/* ---------- helpers ---------- */
function toast(m,bad){const e=document.createElement("div");e.className="glass toast"+(bad?" err":"");e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),2800)}
const fmt=t=>isFinite(t)?Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"):"0:00";
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const buzz=()=>navigator.vibrate&&navigator.vibrate(12);

/* ---------- API (direct Gnani call, no backend) ---------- */
const CONFIG={
  API_KEY:"vach_1ytE2CY5X2DiNvPN4FZ3viqK9vGUDkOqyaPLnRSapXQ4AAXMYlyuK4pqvzNlN941B8q5QfbMTvCCkyqpY3DVXz4PkNPXuMap_d3787f8f12939afce5097174a2e9082d",
  URL:"https://api.vachana.ai/api/v1/tts/inference",
  MODEL:"timbre-v2.5",LANG:"hi-IN"
};
const VOICES=[
  ...["Deepak","Roopesh","Vikrant","Hemraj","Jalaj","Omkar"].map(n=>({id:n,name:n,gender:"male"})),
  ...["Nalini","Bhavna","Yashvi","Urmila","Jwala","Chitra","Ambuja"].map(n=>({id:n,name:n,gender:"female"}))
];
async function loadVoices(){
  st.voices=VOICES;st.apiOk=!!CONFIG.API_KEY;
  if(!st.voice||!VOICES.find(v=>v.id===st.voice))st.voice=VOICES[0].id;
}
async function synth(text,voice,speed){
  let r;
  try{
    r=await fetch(CONFIG.URL,{method:"POST",headers:{"Content-Type":"application/json","X-API-Key-ID":CONFIG.API_KEY},
      body:JSON.stringify({text,voice,model:CONFIG.MODEL,language:CONFIG.LANG,speed,
        audio_config:{sample_rate:44100,num_channels:1,sample_width:2,encoding:"linear_pcm",container:"wav"}})});
  }catch{throw new Error("Network/CORS error: Gnani API browser se block ho rahi hai ya internet nahi hai")}
  if(!r.ok){let m="Gnani error "+r.status;try{const j=await r.json();m=j.error?.message||j.message||m}catch{}throw new Error(m)}
  const b=await r.blob();
  return b.type.includes("audio")?b:new Blob([b],{type:"audio/wav"});
}
async function generate(){
  const text=st.text.trim();
  if(!text)return toast("Pehle text likhein",1);
  if(text.length>2000)return toast("Text 2000 characters se kam rakhein",1);
  st.busy=true;st.err="";render();buzz();
  try{
    const blob=await synth(text,st.voice,st.speed);
    const item={id:Date.now()+"",ts:Date.now(),text,voice:st.voice,blob};
    await hPut(item);st.hist=await hAll();play(item);toast("Audio ready ✓");
  }catch(e){st.err=e.message;toast(e.message,1)}
  st.busy=false;render();
}
async function preview(id,ev){
  ev.stopPropagation();buzz();
  try{const b=await synth("नमस्ते, मैं आपकी आवाज़ हूँ।",id,st.speed);audio.src=URL.createObjectURL(b);audio.play()}
  catch(e){toast(e.message,1)}
}

/* ---------- player ---------- */
$("#wave").innerHTML="<i></i>".repeat(28);
[...$("#wave").children].forEach((e,i)=>e.style.animationDelay=(i%7)*.09+"s");
function play(item){st.cur=item;if(audio.src)URL.revokeObjectURL(audio.src);audio.src=URL.createObjectURL(item.blob);audio.play();$("#player").classList.remove("hide")}
audio.onplay=()=>{$("#player").classList.add("playing");$("#pp").textContent="❚❚"};
audio.onpause=()=>{$("#player").classList.remove("playing");$("#pp").textContent="▶"};
audio.onended=audio.onpause;
audio.onloadedmetadata=()=>$("#dur").textContent=fmt(audio.duration);
audio.ontimeupdate=()=>{$("#cur").textContent=fmt(audio.currentTime);if(audio.duration)$("#seek").value=audio.currentTime/audio.duration*100};
$("#pp").onclick=()=>audio.paused?audio.play():audio.pause();
$("#seek").oninput=e=>{if(audio.duration)audio.currentTime=e.target.value/100*audio.duration};
$("#vol").oninput=e=>audio.volume=e.target.value;
$("#rp").onclick=()=>{audio.currentTime=0;audio.play()};
$("#cl").onclick=()=>{audio.pause();$("#player").classList.add("hide")};
const fileOf=i=>new File([i.blob],"vox-"+i.voice+"-"+i.id+".wav",{type:"audio/wav"});
function download(i){const a=document.createElement("a");a.href=URL.createObjectURL(i.blob);a.download=fileOf(i).name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
async function share(i){const f=fileOf(i);try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"VOX AI"});else{download(i);toast("Share support nahi, file download hui")}}catch{}}
$("#dl").onclick=()=>st.cur&&download(st.cur);
$("#sh").onclick=()=>st.cur&&share(st.cur);

/* ---------- views ---------- */
function voiceCards(){
  const list=st.voices.filter(v=>st.gender==="all"||v.gender===st.gender);
  return `<div class="tabs">${["all","male","female"].map(g=>`<button data-g="${g}" class="${st.gender===g?"on":""}">${{all:"All",male:"Male",female:"Female"}[g]}</button>`).join("")}</div>
  <div class="voices">${list.map(v=>`<div class="v ${st.voice===v.id?"sel":""}" data-v="${v.id}">
    <button class="fav" data-f="${v.id}">${st.favs.includes(v.id)?"★":"☆"}</button>
    <b>${v.name}</b><small>${v.gender==="male"?"Male":"Female"} · Hindi</small><br>
    <button class="pv" data-p="${v.id}">▶ Preview</button></div>`).join("")||"<small>Koi voice nahi mili</small>"}</div>`;
}
const views={
  home:()=>`<h1><span class="logo">VOX AI</span></h1><p class="sub">Your Voice, Reimagined.</p>
  <div class="glass"><textarea id="txt" placeholder="Type or paste your text here...">${esc(st.text)}</textarea>
   <div class="row"><small id="cnt" style="color:var(--mu)">${st.text.length} / 2000</small>
   <span><button id="paste">Paste</button> <button id="clear">Clear</button></span></div></div>
  <div class="glass"><h2>Voice</h2>${voiceCards()}</div>
  ${st.err?`<p class="err">${esc(st.err)}</p>`:""}
  <button class="pri" id="gen" ${st.busy?"disabled":""}>${st.busy?"Generating…":"Generate Speech"}</button>
  <div class="glass" style="margin-top:14px"><h2>Recent</h2>${histList(st.hist.slice(0,3))}</div>`,
  studio:()=>`<h1>Studio</h1><p class="sub">Voice, speed aur favorites</p>
  <div class="glass"><h2>Language</h2><select disabled><option>Hindi (hi-IN)</option></select>
   <label>Speed: <b id="sv">${st.speed.toFixed(1)}x</b></label><input type="range" id="speed" min="0.5" max="1.5" step="0.1" value="${st.speed}">
   <small style="color:var(--mu)">Pitch control abhi Gnani API mein supported nahi hai.</small></div>
  ${st.favs.length?`<div class="glass"><h2>Favorites</h2>${st.favs.map(f=>`<button data-v="${f}" style="margin:3px">★ ${f}</button>`).join("")}</div>`:""}
  <div class="glass"><h2>All voices</h2>${voiceCards()}</div>`,
  history:()=>`<h1>History</h1><p class="sub">Downloaded audio offline bhi chalega</p><div class="glass">${histList(st.hist)}</div>`,
  settings:()=>`<h1>Settings</h1><p class="sub">&nbsp;</p>
  <div class="glass"><div class="sw"><span>Light mode</span><button id="theme">${st.theme==="dark"?"Off":"On"}</button></div>
   <div class="sw"><span>API status</span><b class="${st.apiOk===false?"err":""}">${st.apiOk===null?"…":st.apiOk?"Connected ✓":"Offline ✗"}</b></div>
   <div class="sw"><span>Audio format</span><b>WAV</b></div>
   <div class="sw"><span>Default voice</span><b>${st.voice||"-"}</b></div>
   <div class="sw"><span>Clear history</span><button id="clr">Clear</button></div></div>
  <div class="glass"><h2>About</h2>VOX AI — Your Words. Your Voice. Your AI.<br><small style="color:var(--mu)">Powered by Gnani.ai Timbre</small></div>`
};
function histList(a){return a.length?a.map(i=>`<div class="item"><button data-play="${i.id}">▶</button><div class="t"><div>${esc(i.text)}</div><small>${i.voice} · ${new Date(i.ts).toLocaleString()}</small></div>
  <button data-dl="${i.id}">⬇</button><button data-sh="${i.id}">⇪</button><button data-del="${i.id}">🗑</button></div>`).join(""):"<small style='color:var(--mu)'>Abhi koi audio nahi</small>"}

function render(){
  $("#app").innerHTML=`<div class="view">${views[st.tab]()}</div>`;
  $("#nav").innerHTML=[["home","Home"],["studio","Studio"],["history","History"],["settings","Settings"]].map(([k,l])=>`<button data-t="${k}" class="${st.tab===k?"on":""}">${l}</button>`).join("");
  bind();
}
function bind(){
  const A=$("#app");
  $("#txt")&&($("#txt").oninput=e=>{st.text=e.target.value;$("#cnt").textContent=st.text.length+" / 2000"});
  $("#paste")&&($("#paste").onclick=async()=>{try{st.text=await navigator.clipboard.readText();render()}catch{toast("Paste allow nahi hua, manually paste karein",1)}});
  $("#clear")&&($("#clear").onclick=()=>{st.text="";render()});
  $("#gen")&&($("#gen").onclick=generate);
  $("#speed")&&($("#speed").oninput=e=>{st.speed=+e.target.value;LS.set("speed",st.speed);$("#sv").textContent=st.speed.toFixed(1)+"x"});
  $("#theme")&&($("#theme").onclick=()=>{st.theme=st.theme==="dark"?"light":"dark";LS.set("theme",st.theme);document.documentElement.dataset.theme=st.theme;render()});
  $("#clr")&&($("#clr").onclick=async()=>{if(confirm("Poori history delete karein?")){await hClear();st.hist=[];render()}});
  A.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>{st.gender=b.dataset.g;render()});
  A.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{st.voice=b.dataset.v;LS.set("voice",st.voice);buzz();render()});
  A.querySelectorAll("[data-f]").forEach(b=>b.onclick=e=>{e.stopPropagation();const f=b.dataset.f;st.favs=st.favs.includes(f)?st.favs.filter(x=>x!==f):[...st.favs,f];LS.set("favs",st.favs);render()});
  A.querySelectorAll("[data-p]").forEach(b=>b.onclick=e=>preview(b.dataset.p,e));
  const it=id=>st.hist.find(h=>h.id===id);
  A.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>play(it(b.dataset.play)));
  A.querySelectorAll("[data-dl]").forEach(b=>b.onclick=()=>download(it(b.dataset.dl)));
  A.querySelectorAll("[data-sh]").forEach(b=>b.onclick=()=>share(it(b.dataset.sh)));
  A.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{await hDel(b.dataset.del);st.hist=await hAll();render()});
}
$("#nav").onclick=e=>{const t=e.target.dataset.t;if(t){st.tab=t;buzz();render()}};

(async()=>{render();await loadVoices();try{st.hist=await hAll()}catch{}render()})();
</script>
</body>
</html>
